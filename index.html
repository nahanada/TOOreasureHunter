<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>TOOreasureHunter</title>
<style>
  html, body { margin: 0; height: 100%; background: #222; color: #ddd; font-family: sans-serif; touch-action: none; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }

  #stage { position: relative; display: flex; justify-content: center; }
  /* キャンバスのサイズは main.js が「1ピクセル = 画面の物理1ピクセル」になるよう設定する */
  canvas { display: block; image-rendering: pixelated; background: #000; }
  p { margin: 0; font-size: 14px; }

  /* ---- 全画面（プレイ）モード ---- */
  body.play { background: #000; gap: 0; }
  body.play #stage { position: fixed; inset: 0; align-items: center; }
  body.play p { display: none; }
  /* 右上の全画面ボタン（全画面中は × になって終了ボタンを兼ねる） */
  #btn-fs { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
            width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5);
            background: rgba(0,0,0,.45); color: #fff; font-size: 18px; line-height: 1; padding: 0; z-index: 30; cursor: pointer; }

  /* ---- タッチ操作（スマホ） ---- */
  #touch { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
           padding: 0 max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) calc(max(10px, env(safe-area-inset-left)) + 6px);
           justify-content: space-between; align-items: flex-end; }
  body.touch #touch { display: flex; }
  #touch *, #btn-fs, canvas { touch-action: none; -webkit-user-select: none; user-select: none; }
  #pad { pointer-events: auto; display: flex; width: 144px; height: 63px; border-radius: 32px;
         background: rgba(0,0,0,.35); border: 1.5px solid rgba(255,255,255,.35); }
  #pad > div { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 22px; color: rgba(255,255,255,.85);
               border-radius: 32px; }
  #pad > div.on { background: rgba(255,255,255,.3); }
  #btns { display: flex; gap: 14px; align-items: flex-end; }
  #btn-jump, #btn-action { pointer-events: auto; width: 72px; height: 72px; border-radius: 50%; font-size: 27px; line-height: 1; color: rgba(255,255,255,.9);
              background: rgba(0,0,0,.35); border: 1.5px solid rgba(255,255,255,.45); padding: 0; }
  #btn-action { font-size: 40px; }   /* 丸い点を大きめに */
  #btn-jump.on, #btn-action.on { background: rgba(255,255,255,.35); }
  /* 操作説明（最初のストーリーのあとに出るポップアップ） */
  #help { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
          background: transparent; padding: 12px; box-sizing: border-box; }
  #help .box { position: relative; width: min(440px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y;
               border: 12px solid transparent; background-size: 48px 48px; background-clip: padding-box; image-rendering: pixelated;
               padding: 26px 22px 14px; box-sizing: border-box; color: #3b2a1a; filter: drop-shadow(0 5px 0 rgba(0,0,0,.35)); }
  #help .tape { position: absolute; top: -22px; left: 50%; width: 76px; height: 20px; margin-left: -38px; transform: rotate(-2deg);
                background: rgba(226,200,130,.85); border: 2px solid rgba(120,90,40,.5); box-sizing: border-box; }
  #help table { border-collapse: collapse; width: 100%; font-size: 15px; }
  #help td { padding: 7px 4px; border-bottom: 2px dashed #d8c391; vertical-align: middle; font-weight: bold; }
  #help td:first-child { white-space: nowrap; padding-right: 12px; }
  #help .k { display: inline-block; min-width: 18px; text-align: center; margin-right: 4px; padding: 1px 6px; font-size: 13px;
             border: 2px solid #3b2a1a; border-radius: 4px; background: #efe6c8; box-shadow: 0 2px 0 #3b2a1a; }
  #help .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  #help label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #8a7f68; cursor: pointer; }
  #help label input { width: 18px; height: 18px; accent-color: #999; }
  #help .close { padding: 6px 14px; font-size: 15px; font-weight: bold; color: #3b2a1a; cursor: pointer;
                 border: 3px solid #3b2a1a; border-radius: 6px; background: #f4d35e; box-shadow: 0 3px 0 #3b2a1a; }
  #help .close:active { transform: translateY(2px); box-shadow: 0 1px 0 #3b2a1a; }
  /* 左上のボタン（スマホ・ゲーム中のみ）: リスポーン / はじめから */
  #top-btns { display: none; position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
              gap: 6px; z-index: 30; }
  body.ingame #top-btns { display: flex; }
  body.touch.ingame #btn-retry { display: block; }     /* リスポーンはスマホだけ（PC は R キー） */
  #btn-retry { display: none; }
  #top-btns button { height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid rgba(255,255,255,.5);
                     background: rgba(0,0,0,.45); color: #fff; font-size: 13px; touch-action: none; }
  /* 「タイトルへ戻りますか？」 */
  #confirm { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
             background: rgba(0,0,0,.6); padding: 16px; box-sizing: border-box; }
  #confirm[hidden] { display: none; }
  #confirm .cbox { background: #111; border: 2px solid #fff; border-radius: 10px; padding: 18px 20px; text-align: center; color: #fff; }
  #confirm p { margin: 0 0 14px; font-size: 16px; font-weight: bold; color: #fff; }
  #confirm .btns { display: flex; gap: 12px; justify-content: center; }
  #confirm button { min-width: 88px; height: 38px; border-radius: 8px; border: 2px solid #fff; background: #333; color: #fff; font-size: 15px; font-weight: bold; }
  #confirm #confirm-yes { background: #fff; color: #000; }

</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1080" height="540"></canvas>
</div>
<div id="top-btns"><button id="btn-retry" aria-label="最後のチェックポイントからやり直す">リスポーン</button><button id="btn-restart" aria-label="タイトルへ戻る">はじめから</button></div>
<div id="confirm" hidden><div class="cbox"><p>タイトルへ戻りますか？</p><div class="btns"><button id="confirm-yes">はい</button><button id="confirm-no">いいえ</button></div></div></div>
<button id="btn-fs" aria-label="全画面にする" title="ブラウザのバーを隠す">⛶</button>

<div id="touch">
  <div id="pad"><div id="btn-left">◀</div><div id="btn-right">▶</div></div>
  <div id="btns">
    <button id="btn-jump" aria-label="ジャンプ">▲</button>
    <button id="btn-action" aria-label="アクション（宝箱を開けるなど）">●</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
